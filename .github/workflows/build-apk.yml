name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'smriti-sathi/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        working-directory: smriti-sathi
        run: npm ci

      - name: Build Web Application
        working-directory: smriti-sathi
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: smriti-sathi
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: smriti-sathi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          cp smriti-sathi/android/app/build/outputs/apk/debug/app-debug.apk smriti-sathi/SmritiSathi-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-debug-apk
          path: smriti-sathi/SmritiSathi-latest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Smriti Sathi Latest Build"
          body: |
            ## Smriti Sathi — Latest Android Release
            
            - **Download Link**: [SmritiSathi-latest.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/latest/download/SmritiSathi-latest.apk)
          files: smriti-sathi/SmritiSathi-latest.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
