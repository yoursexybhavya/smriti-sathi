name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'smriti-sathi/package-lock.json'

      # @capacitor/android 8 compiles with Java 21 source/target — on JDK 17 the
      # Gradle step dies with "error: invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        working-directory: smriti-sathi
        run: npm ci

      - name: Build Web Application
        working-directory: smriti-sathi
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: smriti-sathi
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: smriti-sathi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./smriti-sathi/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Asset
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cp smriti-sathi/android/app/build/outputs/apk/debug/app-debug.apk "smriti-sathi/SmritiSathi-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-debug-apk
          path: "smriti-sathi/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Smriti Sathi v${{ steps.get_version.outputs.version }} Release"
          body: |
            ## Smriti Sathi — v${{ steps.get_version.outputs.version }} Android Release
            
            - **Download Link**: [SmritiSathi-v${{ steps.get_version.outputs.version }}.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/download/v${{ steps.get_version.outputs.version }}/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk)
            - **Web Browser (No Install)**: https://smriti-sathi.onrender.com
            - **First run**: this build ships with *no demo data*. Open it once and you will create a real account — name, PIN, the person you care for, and an emergency contact — and every screen starts empty until the elder actually uses it. Between two judges, use **Settings → Erase all data** to get back to first run.
            - **What's new in 3.1.0**:
              - Demo data, sample profiles, seeded sessions and the demo hub are gone; replaced by a real create-account flow and honest empty states everywhere
              - PINs are now salted and hashed instead of being compared against built-in demo accounts
              - Safe Return card and ASHA triage now report the family's real contact and the elder's real sessions, including a "baseline calibrating" state before seven sessions
              - **Settings → Erase all data** resets the device for a clean demonstration
            - **What's new in 3.0.0** — "Warm Heritage Care":
              - Complete UI/UX redesign across the web app and this APK: warm ivory canvas, deep teal ink, saffron and terracotta accents from the logo
              - Fixed the root cause of the broken layout — the unlayered global reset that silently zeroed every spacing utility
              - Phone dock (4 tabs + persistent SOS), tablet rail and a 1240px desktop sidebar from one navigation definition
              - All four cognitive games rebuilt on a shared immersive frame: bigger art, honest timers, gentle errorless-learning cues
              - Emergency tools rebuilt: Safe Return QR + WhatsApp beacon, 112 and Elderline 14567 speed-dial, CR80 wearable badge, 4-7-8 sundowning care with optional chime, ASHA triage
              - Self-hosted Fraunces, Plus Jakarta Sans and Noto Devanagari/Bengali so every script renders offline
              - Five locales complete key-for-key (en, hi, as, brx, mni), English default
              - Light and dark themes, 52/60/72px touch targets, reduced-motion and high-contrast support
          files: "smriti-sathi/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
