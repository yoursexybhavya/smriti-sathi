name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'smriti-sathi/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        working-directory: smriti-sathi
        run: npm ci

      - name: Build Web Application
        working-directory: smriti-sathi
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: smriti-sathi
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: smriti-sathi/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./smriti-sathi/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Asset
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cp smriti-sathi/android/app/build/outputs/apk/debug/app-debug.apk "smriti-sathi/SmritiSathi-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-debug-apk
          path: "smriti-sathi/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Smriti Sathi v${{ steps.get_version.outputs.version }} Release"
          body: |
            ## Smriti Sathi — v${{ steps.get_version.outputs.version }} Android Release
            
            - **Download Link**: [SmritiSathi-v${{ steps.get_version.outputs.version }}.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/download/v${{ steps.get_version.outputs.version }}/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk)
            - **Web Browser (No Install)**: https://smriti-sathi.onrender.com
          files: "smriti-sathi/SmritiSathi-v${{ steps.get_version.outputs.version }}.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
