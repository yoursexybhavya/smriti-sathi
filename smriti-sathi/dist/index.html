    <!--
      Appearance boot script: sets theme / text scale / contrast on <html>
      before first paint so there is never a flash of the wrong palette.
      Keys must stay in sync with AppContext (smriti_sathi_theme) and
      I18nProvider (smriti_lang).
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('smriti_sathi_theme');
          var params = new URLSearchParams(window.location.search);
          var forced = params.get('theme');
          root.dataset.theme = forced === 'dark' ? 'dark' : theme === 'dark' ? 'dark' : 'light';
          root.style.colorScheme = root.dataset.theme;

          var lang = params.get('lang') || localStorage.getItem('smriti_lang') || 'en';
          root.lang = lang;
        } catch (e) {
          root.dataset.theme = 'light';
        }
        root.dataset.scale = 'large';
        root.dataset.contrast = 'normal';
      })();
    </script>

    <style>
      /* First-paint only. Everything else lives in src/styles/*.css inside
         proper @layer blocks, so Tailwind utilities always win. */
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #fbf6ee;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #0c1512;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overscroll-behavior-y: none;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        isolation: isolate;
      }
    </style>
