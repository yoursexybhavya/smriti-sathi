name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Capacitor 8's Android library targets Java 21 — building it on JDK 17
      # fails with "invalid source release: 21".
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmritiSathi-v3.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-latest-apk
          path: SmritiSathi-v3.0.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0.0
          name: "Smriti Sathi v3.0.0 — Warm Heritage Care"
          body: |
            ## Smriti Sathi — v3.0.0 "Warm Heritage Care" Android Release

            - **Download**: [SmritiSathi-v3.0.0.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/download/v3.0.0/SmritiSathi-v3.0.0.apk)
            - **Changelog**:
              - Complete UI/UX redesign across web and Android: warm ivory canvas, deep teal ink, saffron and terracotta accents drawn from the logo
              - Fixed the root cause of the broken layout — the unlayered global reset that silently zeroed every spacing utility
              - Phone dock (4 tabs + persistent SOS), tablet rail and a 1240px desktop sidebar from one navigation definition
              - All four cognitive games rebuilt on a shared immersive frame: bigger art, honest timers, gentle errorless-learning cues
              - Emergency tools rebuilt: Safe Return QR + WhatsApp beacon, 112 and Elderline 14567 speed-dial, CR80 wearable badge, 4-7-8 sundowning care with optional chime, ASHA triage
              - Self-hosted Fraunces, Plus Jakarta Sans and Noto Devanagari/Bengali so every script renders offline
              - Five locales complete key-for-key (en, hi, as, brx, mni), English default
              - Light and dark themes, 52/60/72px touch targets, reduced-motion and high-contrast support
          files: SmritiSathi-v3.0.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
