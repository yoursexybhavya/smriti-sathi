name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmritiSathi-v2.5.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-latest-apk
          path: SmritiSathi-v2.5.3.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.3
          name: "Smriti Sathi v2.5.3 Release"
          body: |
            ## Smriti Sathi — v2.5.3 Android Release
            
            - **Download Link**: [SmritiSathi-v2.5.3.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/download/v2.5.3/SmritiSathi-v2.5.3.apk)
            - **Changelog**:
              - Complete UI/UX onboarding overhaul across all 5 steps (Welcome, Profile, Language, Display, Ready)
              - Elimination of empty black void on desktop browsers with responsive centered container
              - Instant "⚡ Demo Dashboard" one-click evaluation bypass
              - WCAG AAA contrast ratio daylight palette (#F8FAFC, #FFFFFF cards, #0F172A ink)
              - 4 Elder Profile presets (Kamala Baa, Deka Koka, Aai, Bapu) for instant setup
              - Spoken audio test preview on Accessibility setup
          files: SmritiSathi-v2.5.3.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
