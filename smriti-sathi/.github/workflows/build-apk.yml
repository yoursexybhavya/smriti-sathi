name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmritiSathi-v2.5.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-latest-apk
          path: SmritiSathi-v2.5.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "Smriti Sathi v2.5.0 Release"
          body: |
            ## Smriti Sathi — v2.5.0 Android Release
            
            - **Download Link**: [SmritiSathi-v2.5.0.apk](https://github.com/yoursexybhavya/smriti-sathi/releases/download/v2.5.0/SmritiSathi-v2.5.0.apk)
            - **Changelog**:
              - Responsive tablet landscape layout across all screens (Samsung SM-T290 optimized)
              - Dynamic live preview for text size scaling (18px / 24px / 30px) and WCAG AAA high contrast
              - Cognitive game odd-one-out overhaul: eliminated duplicate bottom grids, enabled direct interactive 2x2 cards with labels and speech
              - Visual pattern and sequence completion with live preview slot
              - Explicit Next Level progression buttons and 1-5 difficulty selection
              - Automatic in-app update notification
          files: SmritiSathi-v2.5.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
