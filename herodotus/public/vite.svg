<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF85" />
      <stop offset="45%" stop-color="#D4A856" />
      <stop offset="100%" stop-color="#C69214" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1714" />
      <stop offset="100%" stop-color="#0D0B09" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C69214" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C69214" stop-opacity="0" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#2E2A25" stroke-width="8" />

  <!-- Ambient Golden Aura -->
  <circle cx="256" cy="240" r="160" fill="url(#auraGrad)" />

  <!-- Outer Architectural Arch (Heritage Jharokha / Gate) -->
  <path d="M 140 370 L 140 240 C 140 160 210 110 256 90 C 302 110 372 160 372 240 L 372 370"
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Inner Ornate Keystone Finial -->
  <path d="M 256 70 L 260 85 L 256 95 L 252 85 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="65" r="7" fill="url(#goldGrad)" />

  <!-- Central Map Pin with Heritage Sound Wave Aura -->
  <g filter="url(#goldGlow)">
    <!-- Central Pin Body -->
    <path d="M 256 160 C 220 160 192 188 192 224 C 192 272 256 345 256 345 C 256 345 320 272 320 224 C 320 188 292 160 256 160 Z"
          fill="#12100E" stroke="url(#goldGrad)" stroke-width="10" />
    <!-- Pin Center Core -->
    <circle cx="256" cy="224" r="24" fill="url(#goldGrad)" />
  </g>

  <!-- Audio Waveform Bars (Reflecting Browser Speech Audio Engine) -->
  <g fill="url(#goldGrad)">
    <rect x="186" y="395" width="8" height="24" rx="4" opacity="0.65" />
    <rect x="206" y="385" width="8" height="44" rx="4" opacity="0.85" />
    <rect x="226" y="375" width="8" height="64" rx="4" />
    <rect x="246" y="370" width="8" height="74" rx="4" />
    <rect x="258" y="370" width="8" height="74" rx="4" />
    <rect x="278" y="375" width="8" height="64" rx="4" />
    <rect x="298" y="385" width="8" height="44" rx="4" opacity="0.85" />
    <rect x="318" y="395" width="8" height="24" rx="4" opacity="0.65" />
  </g>

  <!-- Elegant Base Pedestal Line -->
  <line x1="120" y1="460" x2="392" y2="460" stroke="#C69214" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
</svg>
